name: ASTRO BOT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot httpx beautifulsoup4 lxml

      - name: Start ASTRO BOT
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          WELCOME_IMAGE_URL: ${{ secrets.WELCOME_IMAGE_URL }}
        run: |
          python run.py
