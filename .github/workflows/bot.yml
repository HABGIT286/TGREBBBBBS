name: ASTRO BOT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot httpx beautifulsoup4 lxml

      - name: تشغيل ASTRO BOT
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          WELCOME_IMAGE_URL: ${{ secrets.WELCOME_IMAGE_URL }}
        run: |
          python run.py
